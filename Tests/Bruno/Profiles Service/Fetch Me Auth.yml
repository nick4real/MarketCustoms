info:
  name: Fetch Me Auth
  type: http
  seq: 2

http:
  method: GET
  url: "{{gatewayUrl}}/api/profiles/me"
  headers:
    - name: Authorization
      value: "{{vault:jwt_auth0}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
