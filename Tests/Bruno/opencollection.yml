opencollection: 1.0.0

info:
  name: WebStore
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: oauth2
    flow: authorization_code
    authorizationUrl: https://wsnh.eu.auth0.com/authorize
    accessTokenUrl: https://wsnh.eu.auth0.com/oauth/token
    callbackUrl: https://oauth.pstmn.io/v1/callback
    credentials:
      clientId: "{{auth0_clientId}}"
      placement: body
    additionalParameters:
      authorizationRequest:
        - name: audience
          placement: query
          value: "{{gatewayUrl}}"
    scope: openid profile email
    pkce: {}
    tokenConfig:
      id: Auth0 Token
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: false
  variables:
    - name: json_web_token_0plm
      value: ""

docs:
  content: |-
    ### Welcome to Postman! This is your first collection. 

    Collections are your starting point for building and testing APIs. You can use this one to:

    • Group related requests
    • Test your API in real-world scenarios
    • Document and share your requests

    Update the name and overview whenever you’re ready to make it yours.

    [Learn more about Postman Collections.](https://learning.postman.com/docs/collections/collections-overview/)
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
