name: Catalog Service CI

on:
  push:
    branches: ["staging"]
    paths:
      - ".github/workflows/backend-catalog.ci.yml"
      - "Services/Catalog/**"
      - "Tests/Catalog/**"
  pull_request:
    branches: ["staging"]
    paths:
      - ".github/workflows/backend-catalog.ci.yml"
      - "Services/Catalog/**"
      - "Tests/Catalog/**"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
